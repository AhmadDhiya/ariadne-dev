# Menyalakan seluruh aplikasi: docker compose up --build
# Pengaturan (termasuk password) diambil dari file .env; salin dari .env.example dulu.
name: ariadne

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ariadne
      POSTGRES_USER: ariadne
      # Wajib diisi di .env; tidak ada password bawaan (pedoman A5)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env (lihat .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Hanya bisa diakses dari laptop ini (untuk "dotnet run"), tidak dari jaringan (pedoman I4).
    # Angka kiri = port di komputer Anda (54321, sengaja bukan 5432 agar tidak bentrok dengan
    # PostgreSQL lain); angka kanan = port di dalam container (tetap 5432).
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne -d ariadne"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Kotak surat palsu: semua email aplikasi berhenti di sini, tidak terkirim ke orang sungguhan
    image: axllent/mailpit:v1.31.3
    # Halaman web di 18025, SMTP di 10251 (port komputer; di dalam container tetap 8025 dan 1025).
    # Catatan: nomor port maksimal 65535, jadi 80251 tidak valid.
    ports:
      - "127.0.0.1:18025:8025"
      - "127.0.0.1:10251:1025"

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Database=ariadne;Username=ariadne;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      # Alamat aplikasi untuk tautan di email (dari konfigurasi, bukan dari header permintaan)
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:18080}
      # Semua email berhenti di Mailpit (lihat di http://localhost:18025), tidak terkirim ke orang sungguhan
      Email__Host: mailpit
      Email__Port: "1025"
      Email__Security: None
      Email__FromAddress: ariadne@localhost
      # Data contoh dari mockup; hanya dimasukkan di Development dan hanya bila password diisi (pedoman A5)
      Seed__Password: ${SEED_PASSWORD:-}
      # Admin pertama untuk database kosong (mis. produksi); diabaikan bila sudah ada pengguna
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Tidak ada port yang dibuka: API hanya diakses lewat nginx di layanan "web"

  web:
    build: ./frontend
    # Aplikasi dibuka di http://localhost:18080 (80801 tidak valid: port maksimal 65535)
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - api

volumes:
  db-data:
