# Header keamanan untuk halaman frontend (pedoman I3). Header respons API diatur oleh API sendiri.
# CSP: hanya skrip dari server ini (tanpa skrip inline); huruf IBM Plex dari Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS ditambahkan saat hosting dengan HTTPS sudah diputuskan (header ini hanya berlaku di HTTPS).
