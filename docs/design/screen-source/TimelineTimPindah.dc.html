<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Timeline Tim — Pindahkan task</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ariadne/tokens.css">
<link rel="stylesheet" href="ds/ariadne/components/bundle.css">
<script src="ds/ariadne/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 720px; overflow: hidden">
<dc-import name="TimelineTim" theme="{{theme}}" show-dialog="{{yes}}" hint-size="1440px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light', yes: true };
}
}
</script>
</body>
</html>
